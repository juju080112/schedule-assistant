name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不再使用 android-actions/setup-android@v3：它内部会执行 sdkmanager "tools"，
      # 而 Google 已下架 tools 包（Failed to find package 'tools'），会导致构建在第 5 步直接失败。
      # GitHub runner 已预装 Android SDK，这里改为直接复用并接受许可。
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          # 让 Gradle 直接定位 SDK（local.properties 已被 .gitignore 忽略）
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f | head -1); fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          "$SDKMGR" --list_installed 2>/dev/null | head -15 || true

      - name: Install dependencies
        run: npm ci || npm install

      # 课表/校历逻辑自检：不依赖手机与浏览器，Node 里加载真实 www/js/course.js
      # 这一步必须在 cap sync 之前跑，保证同步进原生工程的是通过自检的代码
      - name: Course logic test
        run: node tools/course-logic-test.js

      # 把 www/ 同步进原生工程（生成 capacitor-cordova-android-plugins 与 assets/public）
      - name: Capacitor sync
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 仓库不含签名密钥：未配置 secrets 时用 debug 签名构建（可安装，但签名与正式包不同）
      # 注意：secrets 不能直接写在 if: 条件里，必须在 shell 内判断
      - name: Detect signing availability
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 secrets → 本次构建为 debug 签名，不会附加到 Release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties
          echo "已写入签名配置"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Rename APK
        id: apk
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then SUFFIX="-debug-signed"; fi
          NAME="schedule-assistant-v${VERSION}${SUFFIX}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # v1.8.20：建 Release 与「是否签名」解耦。
      # 旧逻辑只在 signed==true 时才建 Release，而未配置签名 Secrets 时 signed 恒为 false，
      # 结果就是「tag 推上去了、Releases 页面什么都没有」——这次 v1.8.20 就是这么丢的。
      - name: Attach APK to Release (signed)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true

      # 未签名时同样建 Release，只是不附 APK（避免 debug 包覆盖已发布的正式包），
      # 正文里写清去哪里拿安装包。
      - name: Create Release (unsigned)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ⚠️ **本版本未附带 APK**：仓库未配置签名 Secrets，CI 产物为 debug 签名，按既定策略不附加到 Release（避免覆盖正式签名包）。

            安装包获取方式二选一：

            1. 打开本仓库 **Actions → 最新的 Build APK 运行 → Artifacts → `apk`** 下载；
            2. 本地用正式密钥构建：
               ```bash
               cd android && ./gradlew assembleRelease
               ```

            自动生成的更新说明见下方（由本次标签与上一标签之间的提交汇总）。
          append_body: true
